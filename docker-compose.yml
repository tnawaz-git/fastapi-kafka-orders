x-app-env: &app-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  LOG_LEVEL: INFO

x-app-service: &app-service
  build: .
  restart: unless-stopped
  depends_on:
    kafka:
      condition: service_healthy

services:
  kafka:
    image: apache/kafka:3.8.0
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT is for containers on the compose network, PLAINTEXT_HOST for your machine.
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly by the services (see app/kafka_client.py:ensure_topics).
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  api:
    <<: *app-service
    ports:
      - "8000:8000"
    environment:
      <<: *app-env
      DATABASE_PATH: /data/orders.db
    volumes:
      - api-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  inventory-worker:
    <<: *app-service
    command: ["python", "-m", "workers.inventory_worker"]
    environment:
      <<: *app-env
      # Makes some attempts fail on purpose so you can watch retries in the logs.
      SIMULATED_FAILURE_RATE: "0.2"
      INVENTORY_PROCESSING_DELAY_SECONDS: "1.0"

  notification-worker:
    <<: *app-service
    command: ["python", "-m", "workers.notification_worker"]
    environment:
      <<: *app-env

  # Runs the test suite against the broker above: docker compose run --rm tests
  tests:
    build:
      context: .
      target: test
    profiles: ["test"]
    environment:
      TEST_KAFKA_BOOTSTRAP: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  api-data:
