[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
# Unclosed Kafka clients show up as unraisable exceptions; treat them as failures.
filterwarnings =
    error::pytest.PytestUnraisableExceptionWarning
markers =
    integration: needs a Kafka broker (Testcontainers, or TEST_KAFKA_BOOTSTRAP)
    settings: override fields of the integration test Settings, e.g. settings(max_attempts=1)
